<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <!-- Exterior Gradients -->
    <linearGradient id="extFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="extSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="extBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <!-- Interior Gradients (Wood floor, metal walls) -->
    <linearGradient id="intWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="intFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="intCeiling" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Part 1: Front, Left, Bottom -->
    <g transform="translate(50, 40)" filter="url(#drop-shadow)">
      <!-- Left Side -->
      <polygon points="100,50 280,100 280,220 100,170" fill="url(#extSide)" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/>
      <!-- Ribs (detailed) -->
      <path d="M120 65 L120 175 M140 71 L140 181 M160 76 L160 186 M180 82 L180 192 M200 87 L200 197 M220 93 L220 203 M240 98 L240 208 M260 104 L260 214" stroke="#1e40af" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      <path d="M118 64 L118 174 M138 70 L138 180 M158 75 L158 185 M178 81 L178 191 M198 86 L198 196 M218 92 L218 202 M238 97 L238 207 M258 103 L258 213" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <!-- Front Side -->
      <polygon points="20,70 100,50 100,170 20,190" fill="url(#extFront)" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M40 73 L40 175 M60 68 L60 170 M80 63 L80 165" stroke="#1e40af" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      <path d="M38 72 L38 174 M58 67 L58 169 M78 62 L78 164" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      
      <!-- Bottom Side -->
      <polygon points="20,190 100,170 280,220 200,240" fill="url(#extBottom)" stroke="#020617" stroke-width="2" stroke-linejoin="round"/>
      <path d="M40 195 L220 245 M60 190 L240 240 M80 185 L260 235" stroke="#1e293b" stroke-width="4" opacity="0.8"/>
    </g>

    <!-- Part 2: Inside -->
    <g transform="translate(400, 70)" filter="url(#drop-shadow)">
      <!-- Back Wall -->
      <polygon points="40,40 160,40 160,120 40,120" fill="url(#intWall)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
      <path d="M55 40 L55 120 M70 40 L70 120 M85 40 L85 120 M100 40 L100 120 M115 40 L115 120 M130 40 L130 120 M145 40 L145 120" stroke="#94a3b8" stroke-width="4"/>
      
      <!-- Left Inner Wall -->
      <polygon points="0,0 40,40 40,120 0,160" fill="#94a3b8" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      <!-- Right Inner Wall -->
      <polygon points="200,0 160,40 160,120 200,160" fill="#cbd5e1" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      <!-- Ceiling -->
      <polygon points="0,0 200,0 160,40 40,40" fill="url(#intCeiling)" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
      <!-- Floor (Wood Decking) -->
      <polygon points="0,160 200,160 160,120 40,120" fill="url(#intFloor)" stroke="#451a03" stroke-width="2" stroke-linejoin="round"/>
      <path d="M20 156 L60 120 M40 156 L80 120 M60 156 L100 120 M80 156 L120 120 M100 156 L140 120 M120 156 L160 120 M140 156 L180 120 M160 156 L190 130" stroke="#451a03" stroke-width="1.5" opacity="0.6"/>
      
      <!-- Left Door (Open) -->
      <polygon points="0,0 -40,20 -40,180 0,160" fill="url(#extFront)" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/>
      <!-- Right Door (Open) -->
      <polygon points="200,0 240,20 240,180 200,160" fill="url(#extFront)" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Part 3: Rear, Right, Roof -->
    <g transform="translate(680, 20)" filter="url(#drop-shadow)">
      <!-- Right Side -->
      <polygon points="100,100 280,50 280,170 100,220" fill="url(#extSide)" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M120 94 L120 214 M140 89 L140 209 M160 83 L160 203 M180 78 L180 198 M200 72 L200 192 M220 67 L220 187 M240 61 L240 181 M260 56 L260 176" stroke="#1e40af" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      <path d="M118 93 L118 213 M138 88 L138 208 M158 82 L158 202 M178 77 L178 197 M198 71 L198 191 M218 66 L218 186 M238 60 L238 180 M258 55 L258 175" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <!-- Rear Side (Doors) -->
      <polygon points="100,100 20,120 20,240 100,220" fill="url(#extFront)" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/>
      <line x1="60" y1="110" x2="60" y2="230" stroke="#0f172a" stroke-width="3" />
      <!-- Door bars (Shiny Metal) -->
      <path d="M35 117 L35 237 M45 114 L45 234 M75 106 L75 226 M85 104 L85 224" stroke="#e2e8f0" stroke-width="2.5" />
      <path d="M34 117 L34 237 M44 114 L44 234 M74 106 L74 226 M84 104 L84 224" stroke="#ffffff" stroke-width="1" />

      <!-- Roof -->
      <polygon points="20,120 100,100 280,50 200,70" fill="url(#extSide)" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M40 115 L220 65 M60 110 L240 60 M80 105 L260 55" stroke="#1e40af" stroke-width="4" opacity="0.6"/>
      <path d="M40 113 L220 63 M60 108 L240 58 M80 103 L260 53" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    </g>
  </g>
</svg>
