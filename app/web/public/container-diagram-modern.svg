<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="insideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Part 1: Front, Left, Bottom -->
    <g transform="translate(50, 40)">
      <!-- Left Side -->
      <polygon points="100,50 280,100 280,220 100,170" fill="url(#sideGrad)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
      <!-- Left Side Ribs -->
      <line x1="120" y1="65" x2="120" y2="175" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="140" y1="71" x2="140" y2="181" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="160" y1="76" x2="160" y2="186" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="180" y1="82" x2="180" y2="192" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="200" y1="87" x2="200" y2="197" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="220" y1="93" x2="220" y2="203" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="240" y1="98" x2="240" y2="208" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="260" y1="104" x2="260" y2="214" stroke="#94a3b8" stroke-width="1.5" />

      <!-- Front Side -->
      <polygon points="20,70 100,50 100,170 20,190" fill="url(#frontGrad)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
      
      <!-- Bottom Side -->
      <polygon points="20,190 100,170 280,220 200,240" fill="url(#darkGrad)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
      <line x1="40" y1="195" x2="220" y2="245" stroke="#94a3b8" stroke-width="1" />
      <line x1="60" y1="190" x2="240" y2="240" stroke="#94a3b8" stroke-width="1" />
      <line x1="80" y1="185" x2="260" y2="235" stroke="#94a3b8" stroke-width="1" />
    </g>

    <!-- Part 2: Inside -->
    <g transform="translate(400, 70)">
      <!-- Back Wall -->
      <polygon points="40,40 160,40 160,120 40,120" fill="url(#insideGrad)" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      <!-- Left Inner Wall -->
      <polygon points="0,0 40,40 40,120 0,160" fill="#94a3b8" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      <!-- Right Inner Wall -->
      <polygon points="200,0 160,40 160,120 200,160" fill="#94a3b8" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      <!-- Ceiling -->
      <polygon points="0,0 200,0 160,40 40,40" fill="#cbd5e1" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
      <!-- Floor -->
      <polygon points="0,160 200,160 160,120 40,120" fill="#475569" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
      
      <!-- Left Door (Open) -->
      <polygon points="0,0 -40,20 -40,180 0,160" fill="url(#frontGrad)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
      <!-- Right Door (Open) -->
      <polygon points="200,0 240,20 240,180 200,160" fill="url(#frontGrad)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Part 3: Rear, Right, Roof -->
    <g transform="translate(680, 20)">
      <!-- Right Side -->
      <polygon points="100,100 280,50 280,170 100,220" fill="url(#sideGrad)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
      <!-- Right Side Ribs -->
      <line x1="120" y1="94" x2="120" y2="214" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="140" y1="89" x2="140" y2="209" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="160" y1="83" x2="160" y2="203" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="180" y1="78" x2="180" y2="198" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="200" y1="72" x2="200" y2="192" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="220" y1="67" x2="220" y2="187" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="240" y1="61" x2="240" y2="181" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="260" y1="56" x2="260" y2="176" stroke="#94a3b8" stroke-width="1.5" />

      <!-- Rear Side (Doors) -->
      <polygon points="100,100 20,120 20,240 100,220" fill="url(#frontGrad)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
      <line x1="60" y1="110" x2="60" y2="230" stroke="#64748b" stroke-width="2" />
      <!-- Door bars -->
      <line x1="35" y1="117" x2="35" y2="237" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="45" y1="114" x2="45" y2="234" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="75" y1="106" x2="75" y2="226" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="85" y1="104" x2="85" y2="224" stroke="#94a3b8" stroke-width="1.5" />

      <!-- Roof -->
      <polygon points="20,120 100,100 280,50 200,70" fill="url(#frontGrad)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
      <line x1="40" y1="115" x2="220" y2="65" stroke="#cbd5e1" stroke-width="1" />
      <line x1="60" y1="110" x2="240" y2="60" stroke="#cbd5e1" stroke-width="1" />
      <line x1="80" y1="105" x2="260" y2="55" stroke="#cbd5e1" stroke-width="1" />
    </g>
  </g>
</svg>
